<section
  class="bg-white min-vh-100 d-flex justify-content-center align-items-center"
>
  <div class="row">
    <figure class="px-5 col-12 col-md-6">
      <img
        class="img-fluid rounded-circle border border-light border-5 shadow"
        [src]="myUser.image"
        [alt]="myUser.username"
      />
    </figure>
    <div class="card border-0 p-5 col-12 col-md-6">
      <h2 class="fw-semibold mb-1">{{ myUser.first_name }}</h2>
      <h4 class="text-body-secondary mb-5">{{ myUser.last_name }}</h4>
      <h6 class="fw-semibold">Nombre de usuario:</h6>
      <p class="mb-4">{{ myUser.username }}</p>
      <h6 class="fw-semibold">Email:</h6>
      <p class="mb-4">{{ myUser.email }}</p>
      <div><app-buttons [myUser]="myUser" [volver]="true"></app-buttons></div>
    </div>
  </div>
</section>
