<div class="card h-100 d-flex flex-column border-light shadow-sm">
  <figure>
    <img
      class="card-img-top rounded-circle px-4 pt-4"
      [src]="myUser.image"
      [alt]="myUser.first_name"
    />
  </figure>
  <div class="card-body d-flex flex-column flex-grow-1 text-center">
    <div class="pb-2">
      <h5 class="card-title fw-semibold">{{ myUser.first_name }}</h5>
      <h6 class="card-subtitle mb-3 text-body-secondary">
        {{ myUser.last_name }}
      </h6>
    </div>
    <app-buttons
      [myUser]="myUser"
      (deleteItemEmit)="deleteUser($event)"
    ></app-buttons>
  </div>
</div>
