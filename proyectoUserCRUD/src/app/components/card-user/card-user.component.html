<div class="card h-100 d-flex flex-column">
  <img [src]="myUser.image" class="card-img-top" [alt]="myUser.first_name" />
  <div class="card-body d-flex flex-column flex-grow-1">
    <h5 class="card-title">{{ myUser.first_name }} {{ myUser.last_name }}</h5>
    <div class="mt-auto d-grid gap-2">
      <a
        href="#"
        class="btn btn-bd-primary"
        [routerLink]="['/user', myUser._id]"
        >Ver</a
      >
      <a href="#" class="btn btn-bd-outline">Actualizar</a>
      <a href="#" class="btn btn-bd-outline">Borrar</a>
    </div>
  </div>
</div>
